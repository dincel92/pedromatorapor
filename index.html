<style>
/* Layout: tek sütunlu mobil uygulama; yapışkan başlık, şablon listesi, şablonda alttan sabit dört sekme (Alanlar · Ölçütler · Medula · Rapor) */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E8EEF0; --ink:#13212A; --muted:#566874; --line:#D3DCE0; --line2:#B5C3CA;
  --accent:#0B7480; --accent-ink:#FFFFFF; --accent-soft:#DCEFF1;
  --gap-bg:#FBE6BE; --gap-ink:#704300; --gap-line:#E6B65E;
  --bad-bg:#F8DDD9; --bad-ink:#9D2318; --ok:#1C7246; --ok-bg:#DDF0E5; --info:#4F4592; --info-bg:#E9E6F6;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1419; --surface:#141D24; --sunk:#10181E; --ink:#E2EAEE; --muted:#8C9EA9; --line:#24323B; --line2:#36464F;
  --accent:#5DC3CC; --accent-ink:#0B1418; --accent-soft:#163238;
  --gap-bg:#4A3511; --gap-ink:#F5CD80; --gap-line:#8A6420;
  --bad-bg:#47201B; --bad-ink:#FFA096; --ok:#6CD29E; --ok-bg:#12301F; --info:#B9AEFF; --info-bg:#251F43; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1419; --surface:#141D24; --sunk:#10181E; --ink:#E2EAEE; --muted:#8C9EA9; --line:#24323B; --line2:#36464F;
  --accent:#5DC3CC; --accent-ink:#0B1418; --accent-soft:#163238;
  --gap-bg:#4A3511; --gap-ink:#F5CD80; --gap-line:#8A6420;
  --bad-bg:#47201B; --bad-ink:#FFA096; --ok:#6CD29E; --ok-bg:#12301F; --info:#B9AEFF; --info-bg:#251F43; color-scheme:dark; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:1.3rem;letter-spacing:-.01em;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{color:var(--accent);font-weight:600}
.brand svg{flex:0 0 auto}
.iconbtn{border:0;background:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.15;margin:22px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0}
.meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:0 12px;margin:16px 0 12px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink);padding:12px 0;outline:none}
.search .n{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:500;font-size:.9rem;cursor:pointer;white-space:nowrap}
.chip .c{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.recent{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rchip{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:.86rem;cursor:pointer}
.sect{margin-top:22px}
.sect>.lbl{display:block;margin:0 0 8px 2px}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.tbl .th{display:flex;justify-content:space-between;padding:7px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px 12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .nm{font-weight:600;font-size:1rem}
.row .sb{color:var(--muted);font-size:.88rem}
.row .mt{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:2px}
.star{border:0;background:none;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;color:var(--line2);border-radius:6px}
.star[aria-pressed="true"]{color:#D99A1E}
.badge{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;padding:3px 7px;border-radius:5px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.badge.uzman{background:var(--ok-bg);color:var(--ok)}
.badge.bilgi{background:var(--sunk);color:var(--muted)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
/* şablon */
.thead{padding-block:18px 14px;border-bottom:1px solid var(--line)}
.thead h1{margin:0 0 6px;font-size:1.55rem}
.thead .sb{color:var(--muted)}
.thead .sb b{color:var(--ink);font-weight:600}
.thead .mrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:11px 12px;font-weight:600;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.84rem;font-weight:500}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--gap-line);background:var(--gap-bg);color:var(--ink);border-radius:9px;padding:11px 12px;margin-top:14px;font-size:.9rem}
.banner.bad{border-color:var(--bad-ink);background:var(--bad-bg)}
.banner.info{border-color:var(--line2);background:var(--sunk)}
.banner svg{flex:0 0 auto;margin-top:2px}
.banner .t{min-width:0}
.panelh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.74rem;padding:3px 10px;border-radius:99px;background:var(--gap-bg);color:var(--gap-ink);border:1px solid var(--gap-line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer}
.sw input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;margin:0;flex:0 0 auto}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:10px 0 6px}
.legend i{display:inline-block;width:22px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.lg-gap{background:var(--gap-bg);border:1px solid var(--gap-line)} .lg-fill{border-bottom:2px dotted var(--muted);height:8px!important;border-radius:0!important} .lg-bad{background:var(--bad-bg);border:1px solid var(--bad-ink)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-top:16px;max-width:100%}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:500;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cc{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right}
.doc{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:16px 16px;font-family:var(--mono);font-size:.92rem;line-height:2.05;white-space:pre-wrap;word-break:break-word;margin-top:6px}
.tk{display:inline;cursor:pointer;padding:2px 5px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tk.gap{background:var(--gap-bg);color:var(--gap-ink);box-shadow:inset 0 0 0 1px var(--gap-line)}
.tk.fill{background:none;padding:0;border-bottom:1.5px dotted var(--muted);border-radius:0}
.tk.calc{background:none;padding:0;border-bottom:1.5px dashed var(--accent);border-radius:0}
.tk.bad{background:var(--bad-bg);color:var(--bad-ink);padding:2px 5px;border-radius:4px;border-bottom:0}
/* alanlar */
.fgroup{margin-top:18px}
.fgroup>.lbl{display:block;margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .fl{font-size:.84rem;font-weight:600}
.field .hint{font-size:.76rem;color:var(--muted)}
.field.missing input,.field.missing select{border-color:var(--gap-line);box-shadow:inset 3px 0 0 var(--gap-line)}
.field.bad input,.field.bad select{border-color:var(--bad-ink)}
.field.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.field.flash{animation:none}}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inu{position:relative}
.inu span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.76rem;color:var(--muted);pointer-events:none}
.inu input{padding-right:44px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi label{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:.88rem;font-weight:500;cursor:pointer;background:var(--surface)}
.multi input{accent-color:var(--accent);margin:0}
.acr{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.acr table{border-collapse:collapse;width:100%;min-width:420px;font-size:.88rem}
.acr th,.acr td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.acr th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
.acr td input{padding:6px 8px}
.acr td.ch{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.acr .res{padding:10px 12px;font-size:.88rem;border-top:1px solid var(--line)}
.up{color:var(--ok);font-weight:600} .dn{color:var(--bad-ink);font-weight:600}
.atk{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.atk table{border-collapse:collapse;width:100%;min-width:460px;font-size:.88rem}
.atk th,.atk td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.atk th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
.atk .res{padding:10px 12px;font-size:.88rem}
.st{font-family:var(--mono);font-size:.68rem;padding:2px 7px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.bad{background:var(--bad-bg);color:var(--bad-ink)} .st.na{background:var(--gap-bg);color:var(--gap-ink)} .st.info{background:var(--info-bg);color:var(--info)}
/* ölçütler */
.crit{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .l{font-weight:600;font-size:.94rem}
.ci .w{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.ci .m{grid-column:1/-1;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.ci .go{grid-column:1/-1;justify-self:start}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:.84rem;text-decoration:underline;text-underline-offset:2px}
.summ{display:flex;gap:6px;flex-wrap:wrap}
details.law{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:14px}
details.law summary{cursor:pointer;padding:11px 14px;font-weight:600}
details.law .b{padding:0 14px 12px;font-size:.9rem}
details.law .b p{margin:0 0 8px}
details.law .src{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
/* medula */
.kv{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kvr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr);gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.92rem}
.kvr:last-child{border-bottom:0}
.kvr .k{color:var(--muted);font-size:.84rem}
.kvr .v{min-width:0}
.kvr .s{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:2px}
@media (max-width:480px){.kvr{grid-template-columns:1fr}}
ul.notes{margin:10px 0 0;padding-left:18px;font-size:.9rem}
ul.notes li{margin-bottom:6px}
/* alt sekmeler */
nav.bt{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bt .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.bt button{border:0;background:none;padding:14px 4px 13px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
nav.bt button[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:600}
nav.bt .n{font-family:var(--mono);font-size:.7rem;min-width:20px;height:20px;padding:0 5px;border-radius:99px;display:inline-grid;place-items:center;background:var(--gap-bg);color:var(--gap-ink)}
nav.bt .n.bad{background:var(--bad-bg);color:var(--bad-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:40}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.foot p{margin:0 0 6px}
.copyfb{width:100%;min-height:160px;font-family:var(--mono);font-size:.85rem;margin-top:8px;border:1px solid var(--line2);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
</style>

<script>window.SUTQ={"genel": ["(1) Tedaviye uzun süre ara veren (Rituksimab için 12 ay diğer etkin maddeler için 6 ay ve daha uzun süre) hastalarda özel düzenlemeler saklı kalmak kaydıyla yeniden başlangıç kriterleri aranır.", "(2) Ara vermeden; etkisizlik veya yan etki nedeniyle ilaç değişiminin yapılması halinde özel düzenlemeler saklı kalmak kaydıyla tedaviye başlangıç dozu ile başlanır.", "(3) Aynı hasta için iki farklı tanı ile iki farklı anti-TNF veya anti-TNF dışındaki iki farklı biyolojik ajanın birlikte kullanılması halinde bedelleri Kurumca karşılanmaz.", "(4) Tedavi basamaklarında değişiklik yapılması halinde tedavinin başlandığı tarihteki Sağlık Uygulama Tebliğinde yer alan başlangıç kriterleri geçerlidir.", "(5) Tanı değişikliğinin oluşması halinde yeni tanıda idame kriterleri geçerlidir."], "tnf": ["b) Juvenil romatoid artritli (poliartiküler-idiyopatik-kronik) hastalarda;", "1) NSAİ ve en az bir veya daha fazla hastalık modifiye edici anti-romatizmal ilacı en az 3 ay kullanmış ve ACR pediatrik 30 yanıtı alınamamış ise bu durumun belirtildiği 3 ay süreli sağlık kurulu raporuna dayanılarak Anti-TNF ilaçlarla tedaviye başlanabilir. Üveitin eşlik ettiği hastalarda adalimumab ilk seçenek Anti-TNF olarak başlanır.", "2) Tedaviye başlandıktan 3 ay sonra yapılan değerlendirmede ACR pediatrik 30 yanıtının alınması halinde, bu durumun yeni düzenlenecek 3 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile tedaviye devam edilir. Bu raporun süresi sonunda hastanın ACR pediatrik cevap kriteri 50 ve üzerinde olması halinde bu durumun yeni düzenlenecek 6 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile hastaların tedavisine devam edilebilir. Tedavinin devamında ACR pediatrik cevap kriterine 6 ayda bir bakılır, başlangıç ve ACR pediatrik cevap kriteri her sağlık kurulu raporunda belirtilir. Tedaviye rağmen ACR pediatrik cevap kriteri 50’ye ulaşmayan hastalarda anti-TNF tedavisine devam edilmez.", "3) 18 yaş ve üzerinde juvenil romatoid artritli (poliartiküler-idiyopatik-kronik) hastalarda DAS 28 skoruna göre hastalık aktivite ölçümü yapılması esastır. Ancak 18 yaşından küçük iken ACR pediatrik cevap kriterine göre yanıt alınmış hastalarda DAS 28 skoru koşulları aranmaksızın mevcut tedavilere devam edilebilir. 18 yaş ve üzerinde hastalığın alevlenmesi durumunda ise erişkin koşulları (DAS 28 skorlaması) geçerlidir.", "(6) Anti-TNF ilaçlar, tüm romatoloji uzman hekimleri veya üçüncü basamak resmi sağlık hizmeti sunucularında klinik immunoloji veya fiziksel tıp ve rehabilitasyon uzman hekimlerinden birinin yer aldığı en fazla 6 ay süreli sağlık kurulu raporuna dayanılarak, bu uzman hekimlerden biri veya iç hastalıkları veya çocuk sağlığı ve hastalıkları uzman hekimleri tarafından reçete edilebilir.", "(7) Bu ilaçların intravenöz formları, fiziksel tıp ve rehabilitasyon, iç hastalıkları veya çocuk sağlığı ve hastalıkları uzman hekiminin bulunduğu sağlık kurumunda uygulanır. Subkütan formlarının ilk dozları fiziksel tıp ve rehabilitasyon, iç hastalıkları veya çocuk sağlığı ve hastalıkları uzman hekiminin bulunduğu sağlık kurum/kuruluşlarında hekim gözetiminde yapılır. Uygun enjeksiyon tekniği konusunda hastaya veya hasta yakınına eğitim verildikten sonra ilgili uzman hekim uygun gördüğü ve sağlık kurulu raporunda “Mahallinde tedavisi sürdürülebilir” ibaresine yer verdiği taktirde hastane dışında uygulanmak üzere 12 (on iki) haftalık dozlar halinde reçete edilebilir.", "(8) Anti-TNF ilaçlar diğer antiromatizmal ilaçlar ile kombine olarak da kullanılabilir."], "toci": ["(2) poliartiküler juvenil idiopatik artriti bulunan 2 yaş ve üzeri çocuklarda;", "a) NSAİ ve/veya methotrexat veya anti-TNF ile 3 aylık tedavi sonunda ACR pediatrik 30 yanıtı alınamamış ise bu durumun belirtildiği 3 ay süreli sağlık kurulu raporuna dayanılarak ilaca başlanabilir. İlaca başlandıktan 3 ay sonra yapılan değerlendirmede ACR pediatrik 30 yanıtının alınması halinde, bu durumun yeni düzenlenecek 3 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile tedaviye devam edilir. Bu raporun süresi sonunda hastanın ACR pediatrik cevap kriteri 50 ve üzerinde olması halinde bu durumun yeni düzenlenecek 6 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile hastaların tedavisine devam edilebilir. Tedavinin devamında ACR pediatrik cevap kriterine 6 ayda bir bakılır, başlangıç ve ACR pediatrik cevap kriteri her sağlık kurulu raporunda belirtilir.", "b) Sağlık Kurulu raporları; yalnızca üçüncü basamak resmi sağlık hizmeti sunucularında en az bir çocuk romatoloji uzmanı yer alacak şekilde düzenlenir ve bu rapora dayanılarak çocuk romatoloji veya çocuk sağlığı ve hastalıkları uzman hekimleri tarafından reçete edilir."], "aba": ["(2) Juvenil romatoid artritli (poliartiküler-idiyopatik) hastalarda;", "a) 3 aylık anti-TNF tedavisine rağmen ACR pediatrik 30 cevap kriterine ulaşamayan çocuk hastalarda methotrexat ile kombinasyon halinde, yalnızca üçüncü basamak resmi sağlık hizmeti sunucularında içinde en az bir çocuk romatoloji uzmanının bulunduğu 3 (üç) ay süreli sağlık kurulu raporuna dayanılarak bu uzman hekimler veya çocuk sağlığı ve hastalıkları uzman hekimleri tarafından reçete edilir.", "b) İlk 3 aylık abatasept kullanımı sonunda ACR pediatrik 30 cevabına ulaşmış hastalar için bu durumun yeni düzenlenecek 3 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile tedaviye devam edilir. Bu raporun süresi sonunda hastanın ACR pediatrik cevap kriterinin 50 ve üzerinde olması halinde bu durumun 6 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile hastaların tedavisine devam edilebilir. Tedavinin devamında 6 ayda bir ACR pediatrik cevap kriterine bakılır, başlangıç ve ACR cevap kriterleri her sağlık kurulu raporunda belirtilir. Tedaviye rağmen ACR pediatrik cevap kriteri 50’ye ulaşmayan hastalarda abatasept tedavisine devam edilmez."], "tofa": ["(10) Tofacitinibin poliartiküler juvenil idiyopatik artrit hastalığında kullanımı;", "a) Metotreksata yanıtsız, 40 kg ve üzeri aktif Poliartiküler Juvenil İdiyopatik Artriti (pJİA) olan, bir veya daha fazla TNF blokeri ve anti interlökin 6 kullanımına rağmen ACR pediatrik 30 cevap kriterine ulaşamayan veya intoleransı olan hastalarda bu durumun belirtildiği 3 ay süreli sağlık kurulu raporuna dayanılarak tedaviye başlanır.", "b) İlaca başladıktan 3 ay sonra yapılan değerlendirmede ACR pediatrik 30 yanıtının alınması halinde, bu durumun yeni düzenlenecek 3 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile tedaviye devam edilir. Bu raporun süresi sonunda hastanın ACR pediatrik cevap kriteri 50 ve üzerinde olması halinde bu durumun yeni düzenlenecek 6 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile hastaların tedavisine devam edilebilir.", "c) Tedavinin devamında ACR pediatrik cevap kriterine 6 ayda bir bakılır, başlangıç ve ACR pediatrik cevap kriteri her sağlık kurulu raporunda belirtilir.", "ç) Sağlık Kurulu raporlarının; en az bir çocuk romatoloji uzmanının yer aldığı yalnızca üçüncü basamak sağlık hizmeti sunucularında düzenlenmesi ve yine bu uzman hekimler tarafından reçete edilmesi halinde bedeli Kurumca karşılanır."], "sjia": ["(3) Sistemik juvenil idiyopatik artriti (SJİA) bulunan 2 yaş ve üzeri çocuklarda;", "a) Sistemik bulguların ön planda olduğu tip;", "1) Tedaviye nonsteroid antiinflamatuar ilaçlar ve sistemik kortikosteroidler ile başlanır.", "2) Nonsteroid antiinflamatuvar ilaç ve sistemik steroid tedavisi ile üçüncü ayın sonunda remisyona girmemiş hastalarda tosilizumab veya anakinra tedavisine geçilebilir.", "3) Tosilizumab veya anakinra ile tedaviye başlandıktan 3 ay sonra yapılan değerlendirmede ACR pediatrik 50 yanıtının alınması halinde bu durumun yeni düzenlenecek 3 ay süreli sağlık kurulu raporunda belirtilmesi koşulu ile tedaviye devam edilir.", "4) Tedavinin devamında ACR pediatrik yanıt kriterine 3 ayda bir bakılır, başlangıç ve ACR pediatrik yanıt kriteri her sağlık kurulu raporunda belirtilir.", "5) Tedaviye rağmen ACR pediatrik yanıt kriteri 50’ye ulaşmayan hastalarda tedaviye devam 1) Nonsteroid antiinflamatuvar ilaçlar ve sistemik kortikosteroidler ile toplam 3 aylık tedavi sonrasında ACR pediatrik 50 cevabının elde edilemediği ve tosilizumab veya anakinra tedavisine geçilen hastalardan; tosilizumab veya anakinra ile 3 aylık tedaviye rağmen ACR pediyatrik 50 ulaşamayan hastalarda kanakinumab tedavisine geçilebilir.", "2) Tedavinin devamında ACR pediatrik yanıt kriterine 3 ayda bir bakılır, başlangıç ve ACR pediatrik yanıt kriteri her sağlık kurulu raporunda belirtilir, anakinra veya tosilizumab ile ACR pediatrik 50 yanıtı, kanakinumab ile ACR pediatrik 70 yanıtı elde edilemeyen hastalarda tedavi sonlandırılır.", "c) Üçüncü basamak resmi sağlık hizmeti sunucularında bu durumların belirtildiği çocuk romatoloji uzmanının yer aldığı en fazla 3 ay süreli sağlık kurulu raporuna dayanılarak çocuk romatoloji uzman hekimlerince reçete edilir."], "fmf": ["(2) Ailevi Akdeniz Ateşi (FMF) olan vücut ağırlığı 7,5 kg üzerinde 2 yaş ve üstü çocuklar ile yetişkin hastaların tedavisinde;", "a) Amiloidozu olmayan FMF hastalarında,", "1) Tedaviye öncelikle tolere edilebilen maksimum dozda kolşisin ile başlanır. Kolşisin içeren öncelikle yurt içi, yanıt alınamazsa yurt dışı preparatların toplam en az 6 ay kullanılmasına rağmen; son 3 ay içerisinde akut faz reaktanları yüksekliği ile kanıtlanmış en az üç atak geçirmiş (atak dönemlerine ait en az 15 gün arayla ölçülmüş CRP değerinin normal üst sınır değerinin 2 katı ve üstü yüksekliğini gösterir tetkiklerin sonuç ve tarihini içerir bilgilerin raporda belirtilmesi şartıyla yeterli yanıt alınamayan) hastalarda tedaviye anakinra ilave edilebilir. Kolşisine ciddi intolerans nedeniyle ilacın kullanılamadığı durumlarda/dönemlerde tek başına anakinra tedavisi de mümkündür. Anakinra tedavisinden yanıt alınması halinde idame tedaviye anakinra ile devam edilebilir. Anakinra tedavisine 6 aydan fazla süre ara verilmesi veya kesilmesi durumunda son 6 ay içerisinde en az üç atak geçirmiş (atak dönemlerine ait en az 15 gün arayla ölçülmüş CRP değerinin normal üst sınır değerinin 2 katı ve üstü yüksekliğini gösterir tetkiklerin sonuç ve tarihini içerir bilgilerin raporda belirtilmesi şartıyla) hastalarda başlangıç kriterleri aranmaksızın anakinra tedavisine devam edilebilir.", "2) Ara vermeden 3 ay süreyle düzenli anakinra kullanılmasına rağmen son 3 ay içerisinde akut faz reaktanları yüksekliği ile kanıtlanmış en az üç atak (18 yaş altında iki atak) geçirmiş (atak dönemlerine ait en az 15 gün arayla ölçülmüş CRP değerinin normal üst sınır değerinin 2 katı ve üstü yüksekliğini gösterir tetkiklerin sonuç ve tarihini içerir bilgilerin raporda belirtilmesi şartıyla) yeterli yanıt alınamayan hastalarda veya anakinra tedavisine devam etmeyi önleyecek şiddette ciddi yan etki gelişen hastalarda (ilacı kullanamayacağına dair ciddi yan etki geliştiğinin ilgili branş hekimleri tarafından doğrulanmış ve belgelenmiş konsültasyon notunun tarih ve branşının eklenmesi) bu durumların raporda belirtilmesi koşuluyla kanakinumab tedavisine geçilebilir.", "3) Kanakinumab kullanan ve düzenli 3 ay süreyle yapılan kontrollerde atak sıklık ve şiddetinin azaldığı raporda belirtilen hastalarda kanakinumab kullanılmasına devam edilebilir. Kanakinumab tedavisine 6 aydan fazla süre ara verilmesi veya kesilmesi durumunda bu süre zarfında en az üç atak geçirmiş (atak dönemlerine ait en az 15 gün arayla ölçülmüş CRP değerinin normal üst sınır değerinin 2 katı ve üstü yüksekliğini gösterir tetkiklerin sonuç, tarihini içerir bilgilerin raporda belirtilmesi şartıyla) hastalarda başlangıç kriterleri aranmaksızın kanakinumab tedavisine devam edilir. Tedavi altındayken 6 ay ataksız olması ve akut faz reaktanlarının normal olması halinde takip eden 6 ay içerisinde doz aralığı açılır. Doz aralığı önce 6 ay süreyle 2 ayda bire, atak görülmezse sonraki 6 ayda 3 ayda bire çıkarılan hastalarda 6 ay ataksız dönem olması ve akut faz reaktanlarının normal olması halinde kanakinumab tedavisi sonlandırılır.", "4) Ara vermeden 6 ay süreyle düzenli olarak 4 haftada bir 150 mg kanakinumab kullanılmasına rağmen son 3 ay içerisinde akut faz reaktanları yüksekliği ile kanıtlanmış en az üç atak (18 yaş altında iki atak) geçirmiş (atak dönemlerine ait en az 15 gün arayla ölçülmüş CRP değerinin normal üst sınır değerinin 2 katı ve üstü yüksekliğini gösterir tetkiklerin sonuç ve tarihini içerir bilgilerin raporda belirtilmesi şartıyla) yeterli yanıt alınamayan hastalarda bu durumun raporda belirtilmesi halinde 4 haftada bir 300 mg kanakinumab tedavisine geçilebilir.", "5) Anakinra ve kanakinumab etkin maddeli ilaçlar resmi üçüncü basamak sağlık hizmeti sunucularında en az bir romatoloji uzman hekiminin yer aldığı sağlık kurulu raporuna istinaden romatoloji uzman hekimlerince reçete edilir."], "fmfam": ["(2) Ailevi Akdeniz Ateşi (FMF) olan vücut ağırlığı 7,5 kg üzerinde 2 yaş ve üstü çocuklar ile yetişkin hastaların tedavisinde;", "b) Amiloidozu olan FMF hastalığı tedavisinde; tanıda herhangi bir dokuda biyopsi ile AA tipi amiloid varlığı kanıtlanmış FMF hastalarında anakinra ile tedaviye başlanabilir. 3 aylık tedaviye rağmen romatoloji ve/veya nefroloji uzman hekimi tarafından gerekçesi raporda belirtilmesi koşuluyla tedaviye yanıt alınamayan veya bu süre içerisinde anakinra tedavisine devam etmeyi önleyecek şiddette ciddi yan etki gelişen hastalarda (ilgili branş hekimleri tarafından ilacı kullanamayacağına dair doğrulanmış ve belgelenmiş konsültasyon notunun tarih ve branşının eklenmesi) kanakinumab tedavisine geçilebilir. En fazla bir yıl süreli en az bir romatoloji ve/veya nefroloji uzman hekiminin yer aldığı resmi sağlık kurulu raporuna dayanılarak üçüncü basamak sağlık hizmeti sunucularında romatoloji ve/veya nefroloji uzman hekimlerince reçete edilmelidir. Yanıt alınan hastalarda aynı dozda ya da doz aralığı açılarak, romatoloji ve/veya nefroloji uzmanlarının 1 yıl süreli raporu ile tedaviye devam edilebilir."], "traps": ["(3) Periyodik ateş sendromlarından TRAPS (Tümör nekroz edici faktör reseptoru 1 ile ilişkili periodik ateş sendromları), HIDS (Hiperİmmünglobülin D Sendromu) / MKD (Mevalonat Kinaz eksikliği) tanısında kanakinumab kullanımı:", "a) Genetik olarak kanıtlanmış patojenik mutasyon ile tanı almış TRAPS (Tümör nekroz edici faktör reseptoru 1 ile ilişkili periodik ateş sendromları), HIDS (Hiperİmmünglobülin D sendromu) / MKD (mevalonat kinaz eksikliği) hastalarında anakinra ile tedaviye başlanır.", "b) Anakinra ile 3 aylık tedavi sonrasında veya anakinra tedavisine yanıtsız veya anakinraya yan etki gelişen hastalarda (ilacı kullanamayacağına dair ciddi yan etki geliştiğinin ilgili branş hekimleri tarafından doğrulanmış ve belgelenmiş konsültasyon notunun tarih ve branşının eklenerek) kanakinumab tedavisine başlanır. Kanakinumab tedavisinden yanıt alınan hastalarda aynı dozda veya dozu azaltılarak veya doz aralığı açılarak tedaviye devam edilebilir.", "c) En fazla 1 yıl süreli en az bir romatoloji uzman hekiminin yer aldığı üçüncü basamak resmi sağlık hizmeti sunucularında düzenlenen sağlık kurulu raporuna dayanılarak üçüncü basamak resmi sağlık hizmeti sunucularında romatoloji uzman hekimlerince reçete edilir.", "ç) Tedavide yukarıdaki koşulların sağlandığı durumlarda her iki ilaç için de ayrıca Sağlık Bakanlığı endikasyon dışı onay belgesinin alınması halinde bedelleri Kurumca ödenir."], "caps": ["(4) Kriyopirin ilişkili periyodik sendromlar (CAPS) hastalığında;", "1) Kanakinumab 7,5 kg vücut ağırlığının üzerinde olan 2 yaş ve üstü çocuklar ile yetişkinlerde Kriyopirin İlişkili Periyodik Sendromlardan (CAPS); Ailevi Soğuk Otoinflamatuar Sendrom (FCAS)/Ailevi Soğuk Ürtiker (FCU), Muckle-Wells Sendromu (MWS), Neonatal Başlangıçlı Multisistem İnflamatuar Hastalık (NOMID)/Kronik İnfantil Nörolojik, Kütanöz, Artiküler Sendrom (CINCA) tedavisinde kullanılır.", "2) Anakinra erişkinler, adolesanlar, çocuklar ve vücut ağırlığı 10 kg veya üzeri 8 aylık ve daha büyük infantlarda Kriyopirin İlişkili Periyodik Sendromlardan (CAPS); Ailevi Soğuk Otoinflamatuar Sendrom (FCAS), Muckle-Wells Sendromu (MWS), Neonatal Başlangıçlı Multisistem İnflamatuar Hastalık (NOMID)/Kronik İnfantil Nörolojik, Kütanöz, Artiküler Sendrom (CINCA) tedavisinde kullanılır.", "3) Tedaviye anakinra ile başlanır (Ailevi Soğuk Ürtiker (FCU) endikasyonunda ayrıca Sağlık Bakanlığı endikasyon dışı onayı aranır). Anakinra tedavisine yanıt alınamaması veya anakinra tedavisi altındayken anakinra kullanılmasını engelleyecek ciddi klinik yan etki oluşması halinde kanakinumab tedavisine geçilir.", "4) Kanakinumab tedavisinde 6 ay sonunda yapılacak yanıt değerlendirmesine göre yanıt alınamayan hastalarda tedavi kesilir.", "5) Üçüncü basamak sağlık kurumlarında bu durumların belirtildiği romatoloji uzman hekiminin yer aldığı 3 ay süreli sağlık kurulu raporuna dayanılarak romatoloji uzman hekimlerince reçete edilir."], "uveit": ["(12) Üveit hastalığı;", "b) 2 yaşından itibaren çocuklarda, konvansiyonel tedavilere yetersiz yanıt vermiş, konvansiyonel tedavilere uygun olmayan/tolere edemeyen non-enfeksiyöz kronik anterior üveitte 3 ay süreli sağlık kurulu raporuna dayanılarak adalimumab tedavisine başlanabilir. İlacın etkinliği, ilaca başlandıktan 3 ay sonra değerlendirilir. Tedaviye cevap alınmış ve ilaca devam edilecek ise bu durumun belirtildiği 6 ay süreli sağlık kurulu raporuna dayanılarak tedaviye devam edilebilir. Sağlık kurulu raporlarının üçüncü basamak sağlık kurumlarında ve üç göz hastalıkları uzman hekimi tarafından düzenlenmesi ve göz hastalıkları uzman hekimince reçete edilmesi halinde bedelleri Kurumca karşılanır."], "ritux": ["(1) Tedaviye uzun süre ara veren (Rituksimab için 12 ay diğer etkin maddeler için 6 ay ve daha uzun süre) hastalarda özel düzenlemeler saklı kalmak kaydıyla yeniden başlangıç kriterleri aranır.", "(2) Siklofosfamide dirençli veya siklofosfamid tedavisi verilemeyen ciddi, aktif granulamatoz polianjitis (GPA/ Wegener granülomatozu) ve mikroskobik polianjitis (MPA) hastalarının tedavisinde glukokortikoidlerle kombine olarak;", "a) Romatoloji, klinik immunoloji veya nefroloji uzman hekimlerinden en az birinin bulunduğu 1 ay süreli sağlık kurulu raporuna dayanılarak bu uzman hekimler tarafından reçetelenir. 6 aydan önce tekrar kullanılamaz.", "b) Her 6 aydan sonraki kullanım için tedaviye gerekliliğinin belirtildiği yeni sağlık kurulu raporuna dayanılarak aynı koşullarda reçetelenebilir."], "kawa": ["4.2.12.B-1-Spesifik olmayan/gamma/polivalan immünglobulinler (Uygulama yolu Intravenöz veya Intravenöz /Subcutan olan İmmunglobulinler)", "(1) Aşağıda yer alan endikasyonlar için;", "d) Kawasaki hastalığında 1 yıl süre ile romatoloji, immünoloji, immünoloji ve alerji, kardiyoloji, enfeksiyon hastalıkları ve klinik mikrobiyoloji veya çocuk enfeksiyon hastalıkları uzman hekimleri tarafından,", "düzenlenen, yukarıdaki bentlerde belirtilen ilgili uzman hekimlerin yer aldığı sağlık kurulu raporuna istinaden, ilgili bentlerde belirtilen uzman hekimlerce 1 aylık dozda reçete edilmesi halinde bedelleri Kurumca karşılanır. Akut guillain barre sendromu ve bulber tutulumu olan myastenia gravis tanılı acil durumlarda ilgili uzman hekim raporu ile kullanılabilir. (Birdshot retinokoroidopati endikasyonu ödenmez.)", "(5) Faktör dışındaki diğer kan ürünleri de özel renkte (mor) “Kan Ürünleri Reçetesi”ne yazılacaktır. Hastanede yatan hastalar için de aynı reçete kullanılacaktır.", "(6) Kan ürünü reçeteleri, ilgili birimlerden alınacak sağlık kurulu raporlarına bağlı olarak uzman hekimler tarafından yazılabilecektir. Ancak, acil hallerde kullanılması zorunlu olan ürünlerden yalnız tetanos ve anti D immünglobulinleri ile larenks ödemi ile başvuran herediter anjiyoödem tanılı hastaların acil (akut) tedavisinde C1 esteraz inhibitörleri için sağlık kurulu raporu ve mor reçete şartı aranmayacaktır. Hastanelerde yatan hastalarda, faktör dışındaki kan ürünleri için sağlık raporu gerekli değildir. Yeterli uzman hekimi olmayan yerlerde, çıkan vakalara vaktinde müdahale edilebilmesi için yalnız kuduz ve tetanos immunglobulinleri pratisyen hekim tarafından da kan ürünleri reçetesine yazılabilir."], "iloprost": ["(1) İloprost (intravenöz formları), sistemik skleroz (dijital ülser dahil) endikasyonunda, romatoloji veya klinik immünoloji uzman hekimlerince düzenlenen uzman hekim raporuna istinaden bu uzman hekimlerce reçetelenir."], "bosentan": ["(2) Bosentan, sistemik skleroza bağlı dijital ülserli hastalarda;", "a) Kalsiyum kanal blokerleri ve intravenöz iloprost ile en az 3 ay süreyle tedavi görmüş ve yanıt alınamamış ve en az biri 2 mm’den fazla çapı ve görünebilir derinliği olan ağrılı kardinal ülser olmak üzere multiple (≥4 adet) dijital ülseri olan hastalarda tedaviye başlanır. Bosentan etkin maddesini 32 mg dozunda içeren ilaçlar ise bu durumları karşılayan ve yutma güçlüğü çeken (yoğun bakımda tedavi gören veya entübe veya ağızdan beslenemeyen veya nazogastrik beslenme zorunluluğu olan) erişkin hastalarda raporda belirtilmesi koşulu ile reçetelenmesi halinde bedeli Kurumca karşılanır.", "b) Bu hususların belirtildiği, üçüncü basamak sağlık kurumlarında en az bir romatoloji uzman hekiminin bulunduğu 6 ay süreli sağlık kurulu raporuna dayanılarak yine bu sağlık kurumlarında romatoloji uzman hekimlerince reçetelenir."], "ninte": ["(1) Karbonmonoksit difüzyon kapasitesi (DLCO) ≥%30, Forced Vital Kapasitesi (FVC) ≥%50 ve toraks yüksek çözünürlüklü bilgisayarlı tomografi (HRCT) ile %10’dan fazla fibrozis alanı varlığı gösteren sistemik skleroza bağlı interstisyel akciğer hastalarında nintedanib ile tedaviye başlanması halinde bedeli Kurumca karşılanır.", "(2) Bu durumların belirtildiği üçüncü basamak sağlık kurumlarında en az bir romatoloji uzman hekimi ve en az bir göğüs hastalıkları uzman hekiminin yer aldığı 1 yıl süreli sağlık kurulu raporuna dayanılarak göğüs hastalıkları, romatoloji veya iç hastalıkları uzman hekimlerince reçetelenir. Sağlık kurulu raporunda DLCO, FVC değerlerinin tarihi ile HRCT görüntüleme raporunun tarihi belirtilmesi gerekmektedir.", "(3) Hastalar her 12 ayda bir yeniden değerlendirilmelidir. Bu değerlendirmelerde;", "a) FVC değerinde bir önceki sağlık kurulu raporu değerine göre (ataklar dışında) ≥%10 düşme olması ilaca yanıtsızlık olarak kabul edilir ve tedavi sonlandırılır.", "b) Tedavinin devamı için düzenlenen raporlarda ilaç başlama kriterleri aranmaz. Tedavinin devamı için FVC değerinde bir önceki sağlık kurulu raporu değerine göre (ataklar dışında) ≥%10 düşme olmadığı her raporda belirtilmelidir."], "osteo": ["(1) Osteoporoz tedavisinde bifosfonatlar (kombinasyonları dahil) ve diğer osteoporoz ilaçları (raloksifen, calcitonin, stronsiyum ranelat (kombinasyonları dahil), denosumab) aşağıda belirtilen koşullar çerçevesinde ödenir. Bu ilaçlar tedavi süresinin belirtildiği sağlık raporuna dayanılarak reçete edilirler. Rapor süresi 2 yıldır. Bu grup ilaçların birlikte kombine kullanımı halinde sadece birinin bedeli ödenir.", "(2) Osteoporozda ilaç tedavisi, düzenlenecek rapor tarihinden önce son iki yıl içinde yapılan Kemik Mineral Yoğunluk (KMY) ölçümüyle planlanır. Ölçüm yılda bir defadan daha sık yapılamaz. KMY ölçümünün tarihi ve sonucu reçete veya raporda belirtilir. KMY ölçümü bir kalçasında protez olan hastada diğer kalçadan, her iki kalçasında da protez olan hastada vertebra ya da ön koldan yapılabilir.", "ç) Romatoid artrit, çölyak hastalığı, kronik inflamatuar barsak hastalığı (crohn hastalığı veya ülseratif kolit), ankilozan spondilit, hipertiroidi, hipogonadizm, hipopituitarizm, anoreksia nevroza, kronik obstrüktif akciğer hastalığı, tip I diyabet, cushing sendromu ve primer hiperparatiroidizmde, uzun süreli (en az 3 ay) ve > 5mg/gün sistemik kortikosteroid kullanımı olan, kanser tedavisi alan veya organ nakli uygulanmış hastalarda; sekonder gelişen osteoporozda KMY ölçümünde lomber total (L1-4 veya L2-4) veya femur total veya femur boynu KMY ölçümünde “T” değerlerinden herhangi birinin -1 veya daha düşük olması durumunda, (primer hastalığını da belirtir sağlık raporu ile birlikte) reçetelenir.", "(5) Bifosfanat grubu ilaçlar; iç hastalıkları, fiziksel tıp ve rehabilitasyon, ortopedi ve travmatoloji, romatoloji, tıbbi ekoloji ve hidroklimatoloji, kadın hastalıkları ve doğum, endokrinoloji uzmanları tarafından düzenlenen uzman hekim raporu ile tüm uzman hekimlerce reçete edilebilir."], "hbv": ["(1) Akut ve kronik viral hepatit tedavisinde kullanılan ilaçlar gastroenteroloji veya enfeksiyon hastalıkları uzman hekimlerinden biri tarafından düzenlenen sağlık raporuna dayanılarak bu uzman hekimler ile çocuk sağlığı ve hastalıkları veya iç hastalıkları uzman hekimleri tarafından reçete edilir.", "(1) İmmünsupresif ilaç tedavisi veya sitotoksik kemoterapi veya monoklonal antikor tedavisi uygulanmakta olan HBsAg (+) hastalarda, ALT yüksekliği, HBV DNA pozitifliği ve karaciğer biyopsisi koşulu aranmaksızın uygulanmakta olan diğer tedavisi süresince ve bu tedavisinden sonraki en fazla 12 ay boyunca günde 100 mg lamivudin veya 600 mg telbivudin veya 245 mg tenofovir disoproksil fumarat veya 25 mg tenofovir alafenamid fumarat veya 0,5 mg entekavir kullanılabilir. İmmünsupresif, sitotoksik kemoterapi ve monoklonal antikor tedavisine ilişkin ilaç raporunun tarih ve sayısı reçetede belirtilir.", "(3) HBsAg negatif olduğu durumlarda HBV DNA pozitifliği ve/veya Anti HBc pozitifliği durumlarında immünsupresif ilaç tedavisi veya sitotoksik kemoterapi veya monoklonal antikor tedavisi uygulanmakta olan hastalara ALT yüksekliği ve karaciğer biyopsisi koşulu aranmaksızın lamivudin veya telbivudin veya tenofovir disoproksil fumarat veya tenofovir alafenamid fumarat veya entekavir kullanılabilir. Söz konusu tedavilerin bitiminden sonraki en fazla 12 ay boyunca da antiviral tedavi kullanılabilir."], "ek4d": ["(1) EK-4/D Listesinde yer alan hastalıklarda kullanılacak ilaçlar, SUT ve eki listelerde yer alan özel hükümler saklı kalmak kaydıyla, sağlık raporuna dayanılarak en fazla 3 aylık tedavi dozunda reçete edilmesi halinde bedelleri ödenir. SUT’ta yer alan genel ve özel hükümler ve süreler saklı kalmak kaydıyla; EK-4/D Listesinde yer alan ilaçların SUT hükümlerine göre rapor düzenleyebilen uzmanlık dallarındaki branş hekimlerince en fazla 1 yıllık kullanım dozunda reçete edilmesi ve bu reçeteye istinaden söz konusu ilaçların reçete süresi boyunca en fazla üçer aylık dozda sözleşmeli eczanelerden temin edilmesi halinde Kurumca bedelleri ödenir. Bu uygulamadan; renkli reçeteli ilaçlar, endikasyon dışı kullanım onayı ile kullanılan ilaçlar, yurt dışından temin edilen ilaçlar ve 4.2.1, 4.2.10, 4.2.14 maddelerinde yer alan ilaçlar ile Kurumca belirlenecek ilaçlar hariç tutulur.", "(2) Bu listede yer alan etken maddeler için, ilgili başlıktaki tanılara uygun olacak şekilde sağlık raporu düzenlenmesi halinde bu sağlık raporuna istinaden reçete edilen ilaçlar katılım payından muaf tutulur.", "(4) Hasta katılım payı muafiyeti için düzenlenen sağlık raporlarında, teşhis ve ICD-10 kodu yer alacaktır. SUT eki EK-4/Ç Listesinde yer alan kısaltmalar hariç teşhislerde ve etken madde isminde kısaltma yapılmayacaktır.", "(5) Sağlık raporları, SUT’ta yer alan özel düzenlemeler hariç olmak üzere en fazla iki yıl süre ile geçerlidir."], "skr": ["(1) Uzman hekim raporları, ilgili tek uzman hekim tarafından düzenlenecektir.", "(1) İlgili uzmanlık branşından üç uzman hekimin katılımıyla, ilgili uzmanlık branşından üç uzman hekim bulunmaması halinde ise ilgili branş uzmanı ile birlikte öncelikle bu uzmanlık branşına en yakın uzmanlık branşından olmak üzere başhekimin seçeceği diğer uzmanlık branşlarından uzman hekimlerin katılımı ile en az üç uzman hekimden oluşan sağlık kurullarınca düzenlenir.", "(2) Sağlık raporlarının düzenlenmesinde, SUT’un 1.10 maddesi dikkate alınacaktır. Bu raporlar, SUT’ta yer alan istisnalar saklı kalmak kaydıyla SUT’un 1.10.1 maddesi doğrultusunda uzman hekim tarafından düzenlenecek olup, SUT’un 1.10.2 maddesine göre düzenlenen sağlık kurulu raporları da geçerli kabul edilecektir. (MEDULA hastane sistemini kullanan sağlık hizmeti sunucuları raporları elektronik ortamda düzenleyecek ve bu raporlar başhekimlik tarafından elektronik ortamda onaylanacaktır.)"], "edk": ["(4) Bir ilacın Ülkemizde onaylanmış endikasyonu ve Kısa Ürün Bilgisinde tanımlanan dozu dışındaki her türlü kullanımı, Sağlık Bakanlığınca verilen endikasyon dışı ilaç kullanım onayı ile mümkündür.", "b) Kurum web sayfasında yayımlanan EK-4/D Listesinde yanında (*) yıldız işareti bulunmayan ilaçların, söz konusu listede ilişkilendirilen hastalıklarda kullanımı halinde Sağlık Bakanlığı endikasyon dışı ilaç kullanım onayı aranmaz."], "pilo": ["48. Pilokarpin HCL oral formları (Kserostomi tedavisinde; Radyasyon onkolojisi , tıbbi onkoloji, hematoloji veya kulak burun boğaz uzman hekimince düzenlenecek 3 ay süreli uzman hekim raporuna dayanılarak, uzman hekimlerce reçetelenir. Sjögren sendromunda; Romatoloji, immunoloji, Fizik Tedavi ve Rehabilitasyon uzman hekimlerinden birinin yer aldığı ilacın kullanım dozunun da belirtildiği bir yıl süreli sağlık kurulu raporuna dayanılarak bu uzman hekimler veya iç hastalıkları uzman hekimlerince reçete edilir.)"], "edk2": ["(4) Bir ilacın Ülkemizde onaylanmış endikasyonu ve Kısa Ürün Bilgisinde tanımlanan dozu dışındaki her türlü kullanımı, Sağlık Bakanlığınca verilen endikasyon dışı ilaç kullanım onayı ile mümkündür.", "a) Bir ilacın ülkemizde onaylanmış endikasyonu dışındaki her türlü kullanımı için Sağlık Bakanlığı tarafından yayımlanan “Endikasyon Dışı İlaç Kullanımı Kılavuzu”nda belirtilen esaslara da uyulacak olup, kılavuzda tanımlanmamış durumlar için hasta bazında Sağlık Bakanlığı endikasyon dışı ilaç kullanımı onayı aranır. Sağlık Bakanlığı Türkiye İlaç ve Tıbbi Cihaz Kurumu Ek Onay Alınmadan Kullanılabilecek Endikasyon Dışı İlaç Kullanımı Kılavuzunda yapılan düzenlemelerin Sağlık Uygulama Tebliği maddeleri ile çelişmesi durumunda Sağlık Uygulama Tebliği hükümleri geçerlidir. Endikasyon Dışı İlaç Kullanımı Kılavuzunda bulunan ilaçlar için reçeteler ve sağlık raporları, Kılavuzda yer aldığı uzmanlık dalınd
